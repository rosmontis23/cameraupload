[versions]
# 插件版本
agp = "8.13.0"

# 基础依赖版本
appcompat = "1.6.1"
material = "1.10.0"
activity = "1.8.0"
constraintlayout = "2.1.4"

# 功能依赖版本
okhttp = "4.10.0"
gson = "2.10.1"
cameraxCore = "1.3.0"
cameraxCamera2 = "1.3.0"
cameraxLifecycle = "1.3.0"
cameraxView = "1.3.0"

# 测试依赖版本
junit = "4.13.2"                 # 本地单元测试
androidx-junit = "1.1.5"         # AndroidX JUnit 扩展
espresso-core = "3.5.1"          # UI 测试

[libraries]
# 基础 UI 依赖（与 build.gradle.kts 中 libs.xxx 对应）
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }

# 功能依赖
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# CameraX 依赖
camera-core = { module = "androidx.camera:camera-core", version.ref = "cameraxCore" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraxCamera2" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraxLifecycle" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraxView" }

# 测试依赖（与 build.gradle.kts 中测试引用对应）
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
